name: Build Android APK (Jornada BRF)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        # Añadimos @capacitor/cli explícitamente para que npx lo encuentre
        run: |
          npm install
          npm install @capacitor/cli @capacitor/android

      - name: Build Web Project (Vite)
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          # Usamos npx directamente desde los módulos instalados
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JornadaBRF-App
          path: android/app/build/outputs/apk/debug/*.apk
